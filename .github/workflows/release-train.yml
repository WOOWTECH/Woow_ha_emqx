name: Release train

# woow release train, phase 1: compare this add-on's upstream version pins with the
# version manifest shared by HA and the WOOW PaaS (Gitea woow-paas/woow-release-train,
# public mirror WOOWTECH/woow-release-train). What fails is decided by the manifest's
# `enforcement`, not here: in phase 1 only the products' hard rules fail, everything
# else is a warning annotation. To bypass a hard rule, add an exception with a reason
# and an expiry date to the manifest (a reviewed pull request).
# The Woow HA App Store ships a Release only when this check passed on its commit
# (registry.json required_workflows).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Release train
    uses: WOOWTECH/woow-release-train/.github/workflows/wvt-check.yml@main
